    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap"

    <style>
        :root {
            --burgundy: #58111A;
            --burgundy-dark: #35090F;
            --burgundy-deep: #21070B;
            --crimson: #8D1A29;
            --white: #FFFFFF;
            --silver: #C0C0C0;
        }

        body {
            margin: 0;
            background:
                radial-gradient(circle at 80% 10%, rgba(141, 26, 41, .16), transparent 30%),
                radial-gradient(circle at 10% 70%, rgba(114, 21, 34, .12), transparent 28%),
                var(--burgundy-deep);
            color: var(--white);
            font-family: Inter, "Noto Sans Myanmar", system-ui, sans-serif;
            overflow-x: hidden;
        }



  
        }

        .mobile-menu {
            max-height: 0;
            overflow: hidden;
            transition: max-height .35s ease;
        }

        .mobile-menu.open {
            max-height: 500px;
        }

        .orb {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background:
                radial-gradient(circle at 35% 28%, #a62b3b 0%, #721522 20%, #3b0a11 52%, #190306 100%);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, .12),
                0 0 55px rgba(141, 26, 41, .38),
                inset 0 0 45px rgba(0, 0, 0, .65);
            position: relative;
            display: grid;
            place-items: center;
        }

        .orb::before,
        .orb::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, .1);
        }

        .orb::before {
            inset: -18px;
            border-color: rgba(141, 26, 41, .38);
        }

        .orb::after {
            inset: -42px;
            border-color: rgba(255, 255, 255, .06);
        }

        .network-line {
            position: absolute;
            height: 1px;
            transform-origin: left center;
            background: linear-gradient(90deg,
                    transparent,
                    rgba(192, 192, 192, .55),
                    rgba(141, 26, 41, .7),
                    transparent);
        }

        .network-node {
            position: absolute;
            padding: 9px 13px;
            border-radius: 11px;
            background: rgba(24, 3, 7, .82);
            border: 1px solid rgba(255, 255, 255, .12);
            color: #c0c0c0;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: .06em;
            backdrop-filter: blur(10px);
        }

        .network-node::before {
            content: "";
            display: inline-block;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            margin-right: 6px;
            background: #9d2333;
            box-shadow: 0 0 10px rgba(157, 35, 51, .8);
        }

        .floating {
            animation: float 5s ease-in-out infinite;
        }

        .floating-delay {
            animation: float 5s ease-in-out 1.4s infinite;
        }

 
    </style>
</head>

            </div>
            <div class="text-[8px] mt-2 tracking-[.3em] text-silver uppercase">
                Well-Informed
            </div>
        </div>
    </div>
